<!-- 
================================================================================
 项目名称：鹰眼通 -超级公式精算师
 当前版本：v5.3 (独立排行榜 + 固定Tab UI)
 更新日志：
   [v5.3] 1. 彻底修复顶部Tab被挤压的问题，右侧固定“胜率榜”按钮，第一眼可见。
          2. 排行榜新增“分类选择器”，各分类独立排名，不再混杂。
          3. 完美保留原有的正反向预测与共振拦截逻辑。
================================================================================
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>鹰眼通 -超级公式精算师 v5.3</title>
<style>
    :root {
        --bg-base: #f4f7fb;
        --bg-glow: radial-gradient(circle at 10% 20%, #e0e7ff 0%, transparent 40%),
                   radial-gradient(circle at 90% 80%, #fae8ff 0%, transparent 40%),
                   radial-gradient(circle at 50% 50%, #ffffff 0%, transparent 100%);
        --glass-bg: rgba(255, 255, 255, 0.65);
        --glass-border: rgba(255, 255, 255, 0.9);
        --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.07);
        --text-main: #1e293b;
        --text-sub: #64748b;
        
        --card-bg: radial-gradient(circle at 50% 0%, #1c1c1e 0%, #000000 100%);
        --card-border: rgba(255, 255, 255, 0.08);
        
        --cyan: #38bdf8;
        --gold: #fbbf24;
        --green: #10b981;
        --red: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
        background-color: var(--bg-base);
        background-image: var(--bg-glow);
        background-attachment: fixed;
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 15px;
        user-select: none;
        overflow-x: hidden;
    }

    .container {
        width: 100%; max-width: 480px;
        display: flex; flex-direction: column; gap: 16px;
    }
    
    .header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 5px;
    }
    .brand { font-size: 17px; font-weight: 900; display: flex; align-items: center; gap: 8px; color: #0f172a;}
    .version-tag { font-size: 10px; background: #0f172a; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold;}
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px;}
    .data-tag { font-size: 10px; background: rgba(255,255,255,0.6); border: 1px solid var(--glass-border); padding: 2px 6px; border-radius: 4px; color: var(--text-sub); }
    .period-select { font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.05); background: #fff; color: #2563eb; font-weight: bold; outline: none; }

    .draw-section {
        padding: 15px 20px; background: #fff; border-bottom: 1px solid var(--glass-border);
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        border-radius: 16px; box-shadow: var(--glass-shadow);
        position: relative; overflow: hidden;
    }
    .draw-info { font-size: 13px; color: var(--text-sub); font-weight: 900; width: 100%; display: flex; justify-content: space-between; align-items: baseline;}
    .draw-balls { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
    
    .ball-3d {
        width: 34px; height: 34px; border-radius: 50%;
        display: flex; justify-content: center; align-items: center;
        font-size: 14px; font-weight: 900; color: #fff;
        box-shadow: inset -2px -2px 6px rgba(0,0,0,0.55), inset 2px 2px 4px rgba(255,255,255,0.35), 0 3px 5px rgba(0,0,0,0.2);
        position: relative; text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        font-family: "SF Mono", Consolas, monospace;
    }
    .ball-3d::after {
        content: ''; position: absolute; top: 15%; left: 20%;
        width: 25%; height: 25%; border-radius: 50%;
        background: rgba(255,255,255,0.6); filter: blur(1.5px);
    }
    .wave-red { background: radial-gradient(circle at 35% 35%, #ff6b6b, #b90000); }
    .wave-blue { background: radial-gradient(circle at 35% 35%, #74b9ff, #0033cc); }
    .wave-green { background: radial-gradient(circle at 35% 35%, #55efc4, #007733); }
    .ball-special {
        width: 38px; height: 38px; font-size: 15px;
        border: 2px solid var(--gold);
        box-shadow: 0 0 12px rgba(251, 191, 36, 0.5);
        margin-left: 8px;
    }
    .plus-sign { color: #94a3b8; font-size: 18px; font-weight: 900; margin: 0 2px; }

    .glass-card-light {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
        border-radius: 16px;
        overflow: hidden;
    }

    .control-panel { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    
    /* 优化后的 Tabs 布局：左侧滑动，右侧固定 */
    .tabs-wrap {
        display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
    }
    .tabs-left { 
        flex: 1; display: flex; gap: 6px; background: rgba(255,255,255,0.5); border-radius: 8px; padding: 4px; 
        overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .tabs-left::-webkit-scrollbar { display: none; }
    .tab-btn {
        text-align: center; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold;
        color: var(--text-sub); cursor: pointer; border: none; background: transparent; transition: 0.2s; white-space: nowrap;
    }
    .tab-btn.active { background: #fff; color: #2563eb; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    
    .btn-rank-fixed {
        flex-shrink: 0; padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 900;
        background: linear-gradient(135deg, #fbbf24, #d97706); color: #fff; border: none; cursor: pointer;
        box-shadow: 0 4px 10px rgba(217, 119, 6, 0.3); transition: 0.2s;
    }
    .btn-rank-fixed:active { transform: scale(0.95); }

    .formula-selector {
        width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1;
        font-size: 14px; font-weight: bold; color: #1e293b; background: #fff; outline: none;
        appearance: none; -webkit-appearance: none; cursor: pointer;
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat; background-position: right 12px top 50%; background-size: 12px auto;
    }

    .action-btns { display: flex; gap: 10px; margin-top: 4px;}
    .btn-run {
        flex: 1; padding: 14px 0; background: #0f172a; color: #fff; border: none; border-radius: 10px; 
        font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .btn-run:active { transform: scale(0.97); }
    
    .main-result-dark { 
        padding: 24px; 
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        border-radius: 20px;
        position: relative; overflow: hidden;
    }
    
    .watermark {
        position: absolute;
        top: 0; right: 0;
        background: linear-gradient(135deg, #FDE047, #D97706);
        color: #000000;
        font-size: 12px; font-weight: 900;
        padding: 6px 14px;
        border-bottom-left-radius: 12px;
        box-shadow: -2px 2px 10px rgba(0,0,0,0.3);
        z-index: 10; letter-spacing: 1px;
    }

    .res-label { font-size: 14px; color: #e2e8f0; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-weight: 500; padding-right: 80px;}
    .last-info { font-size: 15px; color: var(--gold); font-weight: 900; font-family: monospace; position: absolute; right: 24px; top: 36px;}
    .prev-info { font-size: 12px; color: #94a3b8; margin-bottom: 12px; font-family: monospace;}
    
    .res-main-text {
        font-size: 32px; font-weight: 900; color: var(--gold); 
        letter-spacing: 3px; line-height: 1.4; text-align: center;
        text-shadow: 0 0 20px rgba(251,191,36,0.5), 0 0 40px rgba(251,191,36,0.2);
        margin: 25px 0 15px; word-break: break-all;
    }
    .res-main-text.dim { color: #94a3b8; text-shadow: none; font-size: 24px;}
    
    .extra-info { font-size: 12px; color: #cbd5e1; text-align: center; line-height: 1.6; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 12px; margin-bottom: 15px;}
    .extra-info span { color: var(--gold); font-weight: bold; font-family: monospace;}
    .disclaimer { font-size: 11px; color: #fbbf24; text-align: center; margin-top: 10px; opacity: 0.8; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 10px;}

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-card { padding: 15px; display: flex; flex-direction: column; justify-content: center; }
    .stat-label { font-size: 11px; color: var(--text-sub); margin-bottom: 6px; font-weight: 600;}
    .stat-value { font-weight: 900; color: #0f172a; display: flex; flex-direction: column; gap: 2px;}
    
    .rate-main { font-size: 22px; font-family: monospace; line-height: 1;}
    .rate-sub { font-size: 11px; color: var(--text-sub); font-family: sans-serif; font-weight: normal;}
    
    .val-rate { color: var(--green); }
    .val-win { color: #0284c7; }
    .val-loss { color: var(--red); }
    
    .stat-row-val { font-size: 20px; font-family: monospace; line-height: 1.2;}
    .stat-row-val span.sub { font-size: 12px; color: var(--text-sub); font-weight: normal; font-family: sans-serif;}

    .panel-title { 
        padding: 16px; font-size: 13px; font-weight: bold; color: var(--text-main); 
        display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-left: 4px solid #2563eb;
    }
    .panel-content { padding: 0 16px 16px; display: block; }
    .panel-content.hide { display: none; }

    .log-list { display: flex; flex-direction: column; gap: 8px; max-height: 450px; overflow-y: auto; padding-right: 4px;}
    .log-item { 
        display: flex; align-items: center;
        background: #fff; padding: 10px 12px; border-radius: 8px; 
        border: 1px solid rgba(0,0,0,0.05); font-size: 13px; font-family: monospace;
    }
    .log-item.hit { border-left: 4px solid var(--green); }
    .log-item.miss { border-left: 4px solid var(--red); }
    
    .log-period { font-weight: bold; color: #64748b; width: 75px; flex-shrink: 0;}
    
    .log-detail { flex: 1; text-align: center; font-weight: bold; color: #1e293b; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; padding: 0 5px;}
    .log-predict-box { color: #0f172a; font-size: 13px; word-break: break-all; line-height: 1.4;}
    .log-vs { font-size: 11px; color: #94a3b8; font-weight: normal; margin: 2px 0;}
    .log-actual-box { color: var(--red); font-size: 12px; font-weight: normal; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; word-break: break-all;}
    .log-item.hit .log-actual-box { color: var(--green); background: #ecfdf5;}
    
    .log-status { font-weight: 900; font-size: 14px; width: 35px; text-align: right; flex-shrink: 0;}
    .log-item.hit .log-status { color: var(--green); }
    .log-item.miss .log-status { color: var(--red); }

    /* 排行榜专属优化 */
    .rank-control { display: flex; gap: 10px; margin-bottom: 15px; }
    .rank-control select { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: bold; outline: none;}
    
    .rank-list { display: flex; flex-direction: column; gap: 8px; }
    .rank-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 15px; background: #fff; border-radius: 10px; border: 1px solid rgba(0,0,0,0.05);
        cursor: pointer; transition: 0.2s;
    }
    .rank-item:hover { border-color: #2563eb; background: #f8fafc; }
    .rank-name { font-size: 14px; font-weight: bold; color: #1e293b; }
    .rank-stats { display: flex; align-items: center; gap: 12px; font-size: 13px; font-family: monospace; }
    .rank-rate { color: var(--green); font-weight: 900; font-size: 16px; }

    .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 14px 24px; border-radius: 12px; z-index: 10000; opacity: 0; pointer-events: none; transition: 0.3s; font-size: 14px; font-weight: bold; backdrop-filter: blur(10px); }
    .toast.show { opacity: 1; }
</style>
</head>
<body>
    <div id="toast" class="toast">提示</div>
    
    <div class="container">
        <div class="header">
            <div class="brand">鹰眼通 -超级公式精算师 <span class="version-tag">v5.3</span></div>
            <div class="header-right">
                <span class="data-tag" id="dataSourceTag">连接中...</span>
                <select class="period-select" id="selPeriod" onchange="onPeriodChange()">
                    <option value="30">回测: 30 期</option>
                    <option value="50" selected>回测: 50 期</option>
                    <option value="100">回测: 100 期</option>
                    <option value="200">回测: 200 期</option>
                    <option value="300">回测: 300 期</option>
                    <option value="9999">回测: 全部</option>
                </select>
            </div>
        </div>
        
        <div class="draw-section">
            <div class="draw-info">
                <span id="drawPeriod">加载中...</span>
                <span id="drawDate" style="font-size:11px; font-weight:normal; color:#94a3b8;">--</span>
            </div>
            <div class="draw-balls" id="drawBalls"></div>
        </div>
        
        <div class="glass-card-light control-panel">
            <!-- 优化布局：左侧滑动，右侧固定胜率榜 -->
            <div class="tabs-wrap">
                <div class="tabs-left" id="tabBar">
                    <button class="tab-btn active" data-type="tailKill" onclick="switchTab('tailKill')">杀尾公式</button>
                    <button class="tab-btn" data-type="tailPredict" onclick="switchTab('tailPredict')">出尾公式</button>
                    <button class="tab-btn" data-type="zodiacKill" onclick="switchTab('zodiacKill')">杀肖公式</button>
                    <button class="tab-btn" data-type="zodiacPredict" onclick="switchTab('zodiacPredict')">出肖公式</button>
                    <button class="tab-btn" data-type="codeKill" onclick="switchTab('codeKill')">杀码公式</button>
                    <button class="tab-btn" data-type="tactic" onclick="switchTab('tactic')">围码公式</button>
                </div>
                <button class="btn-rank-fixed" onclick="switchTab('rank')">🏆 胜率</button>
            </div>

            <div id="normalSelectArea">
                <select class="formula-selector" id="selFormula" onchange="runSingle()"></select>
            </div>

            <!-- 排行榜区域专属：增加分类下拉框 -->
            <div id="rankArea" style="display: none;">
                <div class="rank-control">
                    <select id="selRankCategory" onchange="generateRanking()">
                        <option value="tailKill">杀尾公式排名</option>
                        <option value="zodiacKill">杀肖公式排名</option>
                        <option value="tailPredict">出尾公式排名</option>
                        <option value="zodiacPredict">出肖公式排名</option>
                        <option value="codeKill">杀码公式排名</option>
                        <option value="tactic">围码公式排名</option>
                    </select>
                </div>
                <button class="btn-run" id="btnRunRank" onclick="generateRanking()" style="width: 100%; background: #2563eb;">执行分类演算并排名</button>
            </div>
            
            <div class="action-btns" id="runSingleBtnArea">
                <button class="btn-run" id="btnRun" onclick="runSingle()">执行公式推演</button>
            </div>
        </div>

        <!-- 预测卡片 -->
        <div class="main-result-dark" id="predictCard">
            <div class="watermark">鹰眼通·量化首发</div>
            
            <div class="res-label">
                <span id="predictTitle">🔥 目标预测结果</span>
                <span class="last-info" id="lastPeriodInfo">第 -- 期</span>
            </div>
            <div class="prev-info" id="prevInfo">上期: --</div>
            
            <div class="res-main-text" id="targetResult">--</div>
            
            <div class="extra-info" id="resonanceDetail" style="display:none;"></div>
            <div class="disclaimer" id="extraTip" style="display:none;">💡 注：同个值越多，开出概率越小。仅展示高度集中的绝杀尾。</div>
        </div>

        <!-- 四宫格监控 -->
        <div class="stats-grid" id="statsPanel">
            <div class="glass-card-light stat-card">
                <div class="stat-label">公式命中率</div>
                <div class="stat-value val-rate">
                    <span class="rate-main" id="statHitRate">--%</span>
                    <span class="rate-sub" id="statHitCount">(--/--)</span>
                </div>
            </div>
            <div class="glass-card-light stat-card">
                <div class="stat-label">连对 (当前 / 最大)</div>
                <div class="stat-value val-win">
                    <span class="stat-row-val"><span id="statCurWin">--</span><span class="sub"> / <span id="statMaxWin">--</span></span></span>
                </div>
            </div>
            <div class="glass-card-light stat-card">
                <div class="stat-label">连黑 (当前 / 最大)</div>
                <div class="stat-value val-loss">
                    <span class="stat-row-val"><span id="statCurLoss">--</span><span class="sub"> / <span id="statMaxLoss">--</span></span></span>
                </div>
            </div>
            <div class="glass-card-light stat-card">
                <div class="stat-label">有效周期样本</div>
                <div class="stat-value" style="color:#0f172a;">
                    <span class="stat-row-val"><span id="statSampleLen">--</span><span class="sub"> 期</span></span>
                </div>
            </div>
        </div>

        <!-- 排行榜展示区 -->
        <div class="glass-card-light detail-panel" id="rankPanel" style="display: none;">
            <div class="panel-title" style="border-left-color: #fbbf24;">
                <span id="rankPanelTitle">🏆 公式胜率排行榜</span>
            </div>
            <div class="panel-content" style="padding-top: 16px;">
                <div class="rank-list" id="rankList"></div>
            </div>
        </div>

        <!-- 明细面板 -->
        <div class="glass-card-light detail-panel" id="detailPanel">
            <div class="panel-title" onclick="togglePanel('log')" style="border-left-color: #8b5cf6;">
                <span>📋 独立回测验证记录</span>
                <span id="arrowLog" style="color:var(--text-sub); font-size:12px;">展开 ▼</span>
            </div>
            <div class="panel-content hide" id="contentLog">
                <div class="log-list" id="logList"></div>
            </div>
        </div>

    </div>

    <script>
        const DATA_URL = 'https://neyetone.github.io/macsha/history.json';
        const redWave = [1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46];
        const blueWave = [3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48];
        const zodiacMap = {"鼠":[7,19,31,43],"牛":[6,18,30,42],"虎":[5,17,29,41],"兔":[4,16,28,40],"龙":[3,15,27,39],"蛇":[2,14,26,38],"马":[1,13,25,37,49],"羊":[12,24,36,48],"猴":[11,23,35,47],"鸡":[10,22,34,46],"狗":[9,21,33,45],"猪":[8,20,32,44]};
        const wuxingMap = {"金": [4,5,12,13,26,27,34,35,42,43],"木": [8,9,16,17,24,25,38,39,46,47],"水": [1,14,15,22,23,30,31,44,45],"火": [2,3,10,11,18,19,32,33,40,41,48,49],"土": [6,7,20,21,28,29,36,37]};
        const zodiacToWuxing = {"鼠":"水","牛":"土","虎":"木","兔":"木","龙":"土","蛇":"火","马":"火","羊":"土","猴":"金","鸡":"金","狗":"土","猪":"水"};

            }
            else if (fid === "99") {
                let tailsCount = Array(10).fill(0);
                for (let i = 20; i <= 38; i++) {
                    let kT = calcCustomTail(i.toString(), prev);
                    tailsCount[kT]++;
                }
                let maxCount = Math.max(...tailsCount);
                let killTails = [];
                for(let t=0; t<10; t++) {
                    if(tailsCount[t] === maxCount) killTails.push(t);
                }

                if (maxCount < 5) {
                    valid = false; predStr = `观望`;
                } else {
                    isHit = !killTails.includes(rT);
                    predStr = `杀[${killTails.join(',')}]尾`;
                }
            }

            if(predStr.length > 25) predStr = predStr.substring(0, 23) + "...";
            if(actStr.length > 22) actStr = actStr.substring(0, 20) + "...]";
            return { isHit, predStr, actStr, valid };
        }

        function executeBacktest(fid, seqData, testLen) {
            let actualTestLen = Math.min(testLen, seqData.length - 2); 
            let startIdx = seqData.length - actualTestLen;
            let hits = 0, curWin = 0, maxWin = 0, curLoss = 0, maxLoss = 0, validTests = 0, skippedTests = 0; let historyLogs = [];

            for (let i = startIdx; i < seqData.length; i++) {
                if (i < 2) continue; 
                let res = getFormulaResult(fid, i, seqData);
                if (!res.valid) { skippedTests++; continue; }
                
                validTests++;
                if (res.isHit) { hits++; curWin++; curLoss = 0; if (curWin > maxWin) maxWin = curWin; } 
                else { curWin = 0; curLoss++; if (curLoss > maxLoss) maxLoss = curLoss; }
                historyLogs.push({ period: seqData[i].period, predStr: res.predStr, actStr: res.actStr, isHit: res.isHit });
            }
            if(validTests === 0) validTests = 1;
            let rate = (hits / validTests * 100).toFixed(1);
            return { hits, validTests, skippedTests, curWin, maxWin, curLoss, maxLoss, rate, historyLogs };
        }

        function runSingle() {
            if (SEQ.length < 3) return;
            currentFormulaId = document.getElementById('selFormula').value;
            const selectedLen = parseInt(document.getElementById('selPeriod').value);
            const fid = currentFormulaId;

            let currentFormulaName = "";
            Object.values(categoryConfig).forEach(list => {
                let item = list.find(x => x.id === fid);
                if(item) currentFormulaName = item.name;
            });

            let lastRow = SEQ[SEQ.length - 1]; let lastNum = lastRow.num; let lastTail = lastNum % 10; let lastZ = getZodiac(lastNum);
            let nextPeriod = parseInt(lastRow.period) + 1; let nextDateZ = getDayZodiac(new Date(new Date(lastRow.date).getTime() + 86400000).toISOString().split('T')[0]);
            let predText = ""; 
            let resonanceHtml = "";
            let isDim = false;
            
            let virtualPrev = SEQ[SEQ.length-1], virtualPrevPrev = SEQ[SEQ.length-2];
            let vPZ = getZodiac(virtualPrev.num), vPT = virtualPrev.num % 10;
            
            if (fid === "1") { predText = `杀 ${f1Map[vPZ]} 尾`; }
            else if (fid === "2") { predText = `绝杀 ${f2Map[vPT]} 尾`; }
            else if (fid === "3") { predText = f3Map[nextDateZ].split('').join(' '); }
            else if (fid === "4") { predText = f4Map[vPZ].split('').join(' '); }
            else if (fid === "5") { predText = f5Map[vPT].split('').map(t=>t+'尾').join(' '); }
            else if (fid === "6") { predText = f6Map[nextDateZ].split('').map(t=>t+'尾').join(' '); }
            else if (fid === "7") { let kTails = f7Map[vPT]; predText = `杀 ${kTails.join(' ')} 尾`; }
            else if (fid === "8") { predText = `杀 ${f8Map[nextDateZ][0]}`; }
            else if (fid === "9") { predText = f9Map[nextDateZ].split('').map(w=>w+'行').join(' '); }
            else if (fid === "10") {
                let lastFlat = lastRow.flat;
                if (!lastFlat || lastFlat.length !== 6) { lastFlat = []; let rng = lastNum; while(lastFlat.length < 6) { let r = (rng * 7 + 13) % 49 + 1; if (r !== lastNum && !lastFlat.includes(r)) lastFlat.push(r); } }
                let blindDoors = getBlindDoors(lastFlat, lastNum);
                if (blindDoors.length > 0) { predText = `${blindDoors.join(' ')}`; } 
                else {
                    let prevRow = SEQ[SEQ.length - 2]; let prevFlat = prevRow.flat;
                    if (!prevFlat || prevFlat.length !== 6) { prevFlat = []; let rng = prevRow.num; while(prevFlat.length < 6) { let r = (rng * 7 + 13) % 49 + 1; if (r !== prevRow.num && !prevFlat.includes(r)) prevFlat.push(r); } }
                    let prevBlind = getBlindDoors(prevFlat, prevRow.num);
                    predText = prevBlind.length > 0 ? `追溯: ${prevBlind.join(' ')}` : `全门齐`;
                }
            }
            else if (fid === "11") { predText = `杀 ${calendarKillMap[nextDateZ].map(n=>padZero(n)).join(' ')}`; }
            else if (fid === "12") { let sum = nextPeriod.toString().split('').reduce((a,b)=>a+parseInt(b),0); let killNum = calcMod49(sum + 11); predText = `杀 ${padZero(killNum)} (${getZodiac(killNum)})`; }
            else if (fid === "13") { let pMod = calcMod49(nextPeriod); let tAge = zodiacAge2024[lastZ] || 1; let killNum = calcMod49(pMod + tAge + 7); predText = `杀 ${padZero(killNum)} (${getZodiac(killNum)})`; }
            else if (fid === "14") { let dAge = zodiacAge2024[nextDateZ] || 1; let killNum = calcMod49(dAge + 8); predText = `杀 ${padZero(killNum)} (${getZodiac(killNum)})`; }
            else if (fid === "15") { let killNum = calcMod49(lastNum + 5); predText = `杀 ${padZero(killNum)} (${getZodiac(killNum)})`; }
            else if (fid === "16") { let minFlat = Math.min(...(lastRow.flat || [1])); let killNum = calcMod49(minFlat + 47 - lastNum); predText = `杀 ${padZero(killNum)} (${getZodiac(killNum)})`; }
            else if (fid === "17") { let tSum = getSum(lastNum); let pSum = getSum(virtualPrevPrev.num); let killNum = calcMod49(tSum + pSum); predText = `杀 ${padZero(killNum)} (${getZodiac(killNum)})`; }
            else if (fid === "18") { let pSum = getSum(virtualPrevPrev.num); let killNum = calcMod49(lastNum + pSum); predText = `杀 ${padZero(killNum)} (${getZodiac(killNum)})`; }
            else if (fid === "19") { let killNum = calcMod49(lastNum + 2); predText = `杀 ${padZero(killNum)} (${getZodiac(killNum)})`; }
            else if (parseInt(fid) >= 20 && parseInt(fid) <= 38) {
                let kT = calcCustomTail(fid, lastRow);
                predText = `杀 ${kT} 尾`;
            }
            else if (fid === "99") {
                let tailsCount = Array(10).fill(0);
                for (let i = 20; i <= 38; i++) {
                    let kT = calcCustomTail(i.toString(), lastRow);
                    tailsCount[kT]++;
                }
                let maxCount = Math.max(...tailsCount);
                let killTails = [];
                for(let t=0; t<10; t++) {
                    if(tailsCount[t] === maxCount) killTails.push(t);
                }
                
                if (maxCount < 5) {
                    predText = `分歧观望`;
                    isDim = true;
                    resonanceHtml = `⚠️ <b>当前分歧较大：</b><br>最高票数仅 ${maxCount} 票，未达到安全出击阈值。<br>系统已强制拦截，建议等待高共识期。`;
                } else {
                    predText = `绝杀 ${killTails.join(',')} 尾`;
                    resonanceHtml = `👑 <b>全量19套公式共振统合：</b><br>`;
                    resonanceHtml += `<span>${killTails.join(',')}尾</span> (被 ${maxCount} 个公式算出，极度危险)<br>`;
                }
            }

            document.getElementById('predictTitle').innerText = `🔥 ${currentFormulaName}`; 
            document.getElementById('lastPeriodInfo').innerText = `第 ${nextPeriod} 期`; 
            document.getElementById('prevInfo').innerText = `上期开奖: ${lastNum} (${lastZ},尾${lastTail})`;
            
            const targetEl = document.getElementById('targetResult');
            targetEl.innerText = predText; 
            if(isDim) targetEl.classList.add('dim'); else targetEl.classList.remove('dim');
            
            if (fid === "99") {
                document.getElementById('resonanceDetail').style.display = 'block';
                document.getElementById('resonanceDetail').innerHTML = resonanceHtml;
            } else {
                document.getElementById('resonanceDetail').style.display = 'none';
            }

            let bt = executeBacktest(fid, SEQ, selectedLen);
            
            document.getElementById('statSampleLen').innerText = bt.validTests;
            document.getElementById('statHitRate').innerText = bt.rate + "%";
            document.getElementById('statHitCount').innerText = `(${bt.hits} / ${bt.validTests})`;
            document.getElementById('statCurWin').innerText = bt.curWin;
            document.getElementById('statMaxWin').innerText = bt.maxWin;
            document.getElementById('statCurLoss').innerText = bt.curLoss;
            document.getElementById('statMaxLoss').innerText = bt.maxLoss;

            let logHtml = '';
            bt.historyLogs.reverse().forEach(log => {
                let statusClass = log.isHit ? 'hit' : 'miss', statusText = log.isHit ? '准' : '错';
                logHtml += `<div class="log-item ${statusClass}"><div class="log-period">第${log.period}期</div><div class="log-detail"><span class="log-predict-box">${log.predStr}</span><span class="log-vs">vs</span><span class="log-actual-box">${log.actStr}</span></div><div class="log-status">${statusText}</div></div>`;
            });
            document.getElementById('logList').innerHTML = logHtml;
        }

        function onPeriodChange() {
            if (currentTab === 'rank') generateRanking();
            else runSingle();
        }

        // 生成当前分类的排行榜
        function generateRanking() {
            if (SEQ.length < 3) return;
            const selectedLen = parseInt(document.getElementById('selPeriod').value);
            const rankType = document.getElementById('selRankCategory').value; // 获取当前选择的分类
            
            let list = categoryConfig[rankType];
            let results = [];
            
            showToast(`正在演算 ${document.getElementById('selRankCategory').options[document.getElementById('selRankCategory').selectedIndex].text}...`);
            
            setTimeout(() => {
                list.forEach(item => {
                    let bt = executeBacktest(item.id, SEQ, selectedLen);
                    results.push({ fid: item.id, name: item.name, rate: parseFloat(bt.rate), hits: bt.hits, valid: bt.validTests });
                });

                results.sort((a,b) => b.rate - a.rate);

                let html = '';
                results.forEach((res, index) => {
                    let color = res.rate >= 80 ? 'var(--green)' : (res.rate >= 60 ? '#d97706' : 'var(--red)');
                    let medal = index === 0 ? '🥇 ' : (index === 1 ? '🥈 ' : (index === 2 ? '🥉 ' : ''));
                    html += `
                        <div class="rank-item" onclick="jumpToFormula('${res.fid}')">
                            <div class="rank-name">${medal}${res.name}</div>
                            <div class="rank-stats">
                                <span style="color:var(--text-sub);">${res.hits}/${res.valid}</span>
                                <span class="rank-rate" style="color:${color};">${res.rate}%</span>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('rankList').innerHTML = html;
                showToast("排位演算完成！");
            }, 100);
        }

        function jumpToFormula(fid) {
            let targetTab = 'tailKill';
            for (let key in categoryConfig) {
                if (categoryConfig[key].some(x => x.id === fid)) {
                    targetTab = key; break;
                }
            }

            switchTab(targetTab);
            document.getElementById('selFormula').value = fid;
            runSingle();
        }

        window.onload = () => { 
            initData().then(() => {
                switchTab('tailKill'); 
            }).catch(e => console.error(e));
        };
    </script>
